{% extends "base.html" %}
{% block content %}
<div class="row mb-4">
    <div class="col"><h2>Staff Dashboard</h2><p class="text-muted">Concise overview of your assignments.</p></div>
</div>
<div class="row">
    <div class="col-md-6">
        <div class="card text-white bg-primary mb-3 text-center">
            <div class="card-body">
                <h5 class="card-title">My Assigned Treks</h5><h2 class="display-6">{{ total_treks }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card text-white bg-success mb-3 text-center">
            <div class="card-body">
                <h5 class="card-title">Total Participants</h5><h2 class="display-6">{{ total_participants }}</h2>
            </div>
        </div>
    </div>
</div>
{% endblock %}
