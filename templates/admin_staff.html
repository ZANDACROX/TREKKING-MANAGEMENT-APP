{% extends "base.html" %}
{% block content %}
<div class="row mb-3">
    <div class="col">
        <h2>Manage Staff</h2>
    </div>
</div>
<div class="card shadow-sm mb-4">
    <div class="card-header bg-info text-white">Trek Staff</div>
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr>
                    <th>Name</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for s in staff %}
                <tr>
                    <td>{{ s.username }}</td>
                    <td>
                        <span class="badge bg-{{ 'success' if s.status == 'approved' else 'warning text-dark' if s.status == 'pending' else 'danger' }}">
                            {{ s.status }}
                        </span>
                    </td>
                    <td>
                        <form method="POST" action="/admin/staff" class="d-inline">
                            <input type="hidden" name="user_id" value="{{ s.id }}">
                            {% if s.status == 'pending' %}
                                <button type="submit" name="action" value="approve" class="btn btn-success btn-sm">Approve</button>
                            {% endif %}
                            {% if s.status == 'blacklisted' %}
                                <button type="submit" name="action" value="activate" class="btn btn-success btn-sm">Reactivate</button>
                            {% else %}
                                <button type="submit" name="action" value="blacklist" class="btn btn-danger btn-sm">Blacklist</button>
                            {% endif %}
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" class="text-center">No staff found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
