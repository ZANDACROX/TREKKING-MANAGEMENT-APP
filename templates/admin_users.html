{% extends "base.html" %}
{% block content %}
<div class="row mb-3"><div class="col"><h2>Manage Users</h2></div></div>
<div class="card shadow-sm">
    <div class="card-header bg-success text-white">Trekkers (Users)</div>
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light"><tr><th>Name</th><th>Status</th><th>Action</th></tr></thead>
            <tbody>
                {% for u in users %}
                <tr>
                    <td>{{ u.username }}</td>
                    <td><span class="badge bg-{{ 'success' if u.status == 'active' else 'danger' }}">{{ u.status }}</span></td>
                    <td>
                        <form method="POST" action="/admin/users" class="d-inline">
                            <input type="hidden" name="user_id" value="{{ u.id }}">
                            {% if u.status == 'active' %}<button type="submit" name="action" value="blacklist" class="btn btn-danger btn-sm">Blacklist</button>
                            {% else %}<button type="submit" name="action" value="activate" class="btn btn-success btn-sm">Reactivate</button>{% endif %}
                        </form>
                    </td>
                </tr>
                {% else %}<tr><td colspan="3" class="text-center">No users found.</td></tr>{% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
