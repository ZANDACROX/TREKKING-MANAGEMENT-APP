{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 mt-4">
        <div class="card shadow border-0">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4><i class="bi bi-person-badge me-2"></i>My Profile</h4>
            </div>
            <div class="card-body p-4">
                <table class="table table-borderless">
                    <tbody>
                        <tr>
                            <th class="text-muted" style="width: 30%;">Username:</th>
                            <td class="fs-5">{{ current_user.username }}</td>
                        </tr>
                        <tr>
                            <th class="text-muted">Email:</th>
                            <td class="fs-5">{{ current_user.email }}</td>
                        </tr>
                        <tr>
                            <th class="text-muted">Account Role:</th>
                            <td>
                                <span class="badge bg-primary text-uppercase">{{ current_user.role }}</span>
                            </td>
                        </tr>
                        <tr>
                            <th class="text-muted">Account Status:</th>
                            <td>
                                <span class="badge bg-success text-uppercase">{{ current_user.status }}</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
